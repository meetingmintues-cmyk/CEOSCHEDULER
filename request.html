<title>Request a Meeting · CEO Office</title>

<style>
:root{--bg:#070a14;--panel:rgba(18,24,46,.78);--solid:#121830;--p2:rgba(255,255,255,.045);--line:rgba(148,163,255,.14);--line2:rgba(148,163,255,.26);--text:#e8ecff;--muted:#8e98c2;--dim:#5d6791;
  --cyan:#22d3ee;--violet:#a855f7;--pink:#f472b6;--green:#34d399;--amber:#fbbf24;--red:#f87171;--grad:linear-gradient(135deg,#22d3ee 0%,#6366f1 50%,#a855f7 100%);--glow:0 0 0 1px rgba(99,102,241,.25),0 10px 40px -10px rgba(99,102,241,.45)}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#eef1fb;--panel:rgba(255,255,255,.86);--solid:#fff;--p2:rgba(15,23,60,.04);--line:rgba(30,41,99,.10);--line2:rgba(30,41,99,.2);--text:#121735;--muted:#59618a;--dim:#8a92b5;--glow:0 0 0 1px rgba(99,102,241,.18),0 10px 30px -12px rgba(99,102,241,.35)}}
:root[data-theme="light"]{--bg:#eef1fb;--panel:rgba(255,255,255,.86);--solid:#fff;--p2:rgba(15,23,60,.04);--line:rgba(30,41,99,.10);--line2:rgba(30,41,99,.2);--text:#121735;--muted:#59618a;--dim:#8a92b5;--glow:0 0 0 1px rgba(99,102,241,.18),0 10px 30px -12px rgba(99,102,241,.35)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sora',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;padding-bottom:env(safe-area-inset-bottom)}
button,input,textarea,select{font-family:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.fx{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.fx i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.42;animation:fl 20s ease-in-out infinite}
.fx i:nth-child(1){width:480px;height:480px;background:#22d3ee;top:-180px;left:-140px}
.fx i:nth-child(2){width:520px;height:520px;background:#a855f7;bottom:-220px;right:-160px;animation-delay:-7s}
:root[data-theme="light"] .fx i{opacity:.22}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .fx i{opacity:.22}}
@keyframes fl{50%{transform:translate(40px,30px) scale(1.06)}}
.wrap{max-width:720px;margin:0 auto;padding:18px 16px 60px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.logo{width:38px;height:38px;border-radius:12px;background:var(--grad);display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px;box-shadow:var(--glow)}
.top b{font-size:14px;display:block}.top small{font-size:10.5px;letter-spacing:1.6px;color:var(--muted);text-transform:uppercase}
.tbtn{margin-left:auto;width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--p2);display:grid;place-items:center}
.tbtn svg{width:17px;height:17px}
.hero{display:flex;gap:18px;align-items:center;margin-bottom:22px;animation:up .7s cubic-bezier(.2,.8,.2,1) both}
.av{position:relative;width:92px;height:92px;flex:none}
.av::before{content:"";position:absolute;inset:-4px;border-radius:50%;background:conic-gradient(#22d3ee,#6366f1,#a855f7,#f472b6,#22d3ee);animation:sp 6s linear infinite}
.av img{position:relative;width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid var(--bg)}
@keyframes sp{to{transform:rotate(360deg)}}
.hero h1{font-size:clamp(22px,5vw,30px);font-weight:800;letter-spacing:-.6px;line-height:1.15}
.hero h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);font-size:13px;margin-top:6px;line-height:1.5}
.tabs{display:flex;gap:4px;padding:4px;border-radius:14px;border:1px solid var(--line);background:var(--p2);margin-bottom:16px}
.tabs button{flex:1;padding:11px;border-radius:10px;font-size:13px;font-weight:700;color:var(--muted);display:flex;gap:8px;align-items:center;justify-content:center;transition:.25s}
.tabs button.on{background:var(--grad);color:#fff;box-shadow:var(--glow)}
.tabs .n{font-family:'JetBrains Mono',monospace;font-size:11px;padding:1px 7px;border-radius:999px;background:rgba(255,255,255,.22)}
.tabs button:not(.on) .n{background:var(--line2);color:var(--text)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 20px 50px -24px rgba(0,0,0,.5);margin-bottom:14px;animation:up .6s cubic-bezier(.2,.8,.2,1) both}
.card:nth-of-type(2){animation-delay:.06s}.card:nth-of-type(3){animation-delay:.12s}
@keyframes up{from{opacity:0;transform:translateY(16px)}}
.ch{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-size:13px;font-weight:800;letter-spacing:.3px}
.ch i{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-style:normal;background:var(--p2);border:1px solid var(--line)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}.f.full{grid-column:1/-1}
label.l{font-size:10.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
label.l em{color:var(--pink);font-style:normal}
.in{height:46px;border-radius:12px;border:1px solid var(--line2);background:var(--p2);padding:0 13px;font-size:15px;outline:none;transition:.2s;width:100%}
textarea.in{height:88px;padding:11px 13px;resize:vertical;line-height:1.45}
.in:focus{border-color:var(--cyan);box-shadow:0 0 0 4px rgba(34,211,238,.14)}
:root:not([data-theme="light"]) .in{color-scheme:dark}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{padding:9px 14px;border-radius:999px;border:1px solid var(--line2);font-size:13px;font-weight:600;color:var(--muted);transition:.2s;background:var(--p2)}
.chips button.on{color:#fff;background:var(--grad);border-color:transparent;box-shadow:var(--glow)}
.chips.pr button.on[data-v="Urgent"]{background:linear-gradient(135deg,#f87171,#fb923c)}
.chips.pr button.on[data-v="Important"]{background:linear-gradient(135deg,#fbbf24,#fb923c)}
.hp{position:absolute;left:-9999px;opacity:0}
.remember{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--muted);margin:4px 2px 14px;cursor:pointer}
.remember input{width:18px;height:18px;accent-color:#6366f1}
.err{display:none;margin-bottom:12px;padding:11px 13px;border-radius:12px;font-size:13px;color:var(--red);background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.35)}
.err.on{display:block;animation:sh .4s}
@keyframes sh{25%,75%{transform:translateX(-6px)}50%{transform:translateX(6px)}}
.go{width:100%;height:54px;border-radius:16px;background:var(--grad);color:#fff;font-size:15.5px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:var(--glow),0 16px 30px -14px rgba(99,102,241,.8);transition:.2s}
.go:active{transform:scale(.98)}.go[disabled]{opacity:.7}
.go svg{width:18px;height:18px}
.spn{width:16px;height:16px;border-radius:50%;border:2.5px solid #fff;border-right-color:transparent;animation:sp .8s linear infinite}
.hint{font-size:11.5px;color:var(--dim);line-height:1.45;margin-top:2px}.hint b{color:var(--muted)}
.who{display:flex;align-items:center;gap:12px;margin-bottom:12px}.who .wav{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-weight:800;background:linear-gradient(135deg,#22d3ee,#a855f7);color:#fff;flex:none}
.who b{display:block;font-size:15px}.who small{color:var(--muted);font-size:12px}.who .so{margin-left:auto;height:36px;padding:0 12px;font-size:12px}
.signin .grid{margin-top:12px}.signin h3{margin:0 0 4px;font-size:17px}.signin p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}
.fine{font-size:11.5px;color:var(--dim);text-align:center;margin-top:12px;line-height:1.5}
/* success */
.ok{text-align:center;padding:30px 20px}
.tick{width:86px;height:86px;margin:0 auto 16px;border-radius:50%;background:var(--grad);display:grid;place-items:center;box-shadow:var(--glow);animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
.tick svg{width:42px;height:42px;color:#fff;stroke-dasharray:30;stroke-dashoffset:30;animation:dr .5s .35s forwards}
@keyframes pop{from{transform:scale(.3);opacity:0}}@keyframes dr{to{stroke-dashoffset:0}}
.ok h2{font-size:24px;font-weight:800}.ok p{color:var(--muted);font-size:13.5px;margin-top:8px;line-height:1.55}
.ref{display:inline-block;margin:16px 0 6px;font-family:'JetBrains Mono',monospace;font-size:26px;font-weight:700;letter-spacing:3px;padding:10px 18px;border-radius:14px;border:1px dashed var(--line2);background:var(--p2)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.btn{height:46px;border-radius:13px;border:1px solid var(--line2);font-size:13.5px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--p2);transition:.2s}
.btn svg{width:16px;height:16px}.btn.full{grid-column:1/-1}.btn.wa{background:#25d366;color:#05301a;border-color:transparent}
.btn:active{transform:scale(.98)}
.btn.red{color:var(--red);border-color:rgba(248,113,113,.4)}
/* my requests */
.req{position:relative;overflow:hidden}
.req::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--sc,var(--amber))}
.rq-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.rq-top b{font-size:15px;line-height:1.3}
.rq-ref{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);margin-top:4px}
.pill{font-size:10.5px;font-weight:800;letter-spacing:.8px;padding:5px 10px;border-radius:999px;white-space:nowrap;color:var(--sc);background:color-mix(in srgb,var(--sc) 15%,transparent);border:1px solid color-mix(in srgb,var(--sc) 40%,transparent)}
.steps{display:flex;align-items:center;margin:16px 0 4px}
.st{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10.5px;color:var(--dim);font-weight:600;flex:none;width:72px;text-align:center}
.st i{width:24px;height:24px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center;font-style:normal;font-size:12px;background:var(--solid)}
.st.on{color:var(--text)}.st.on i{background:var(--sc);border-color:var(--sc);color:#fff;box-shadow:0 0 0 4px color-mix(in srgb,var(--sc) 20%,transparent)}
.bar{flex:1;height:2px;background:var(--line2);margin:0 -14px 18px;border-radius:2px}.bar.on{background:var(--sc)}
.sched{margin-top:14px;padding:14px;border-radius:14px;background:color-mix(in srgb,var(--sc) 10%,transparent);border:1px solid color-mix(in srgb,var(--sc) 30%,transparent)}
.sched .big{font-size:18px;font-weight:800}.sched small{display:block;color:var(--muted);font-size:12.5px;margin-top:5px;line-height:1.5}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12px;color:var(--muted)}
.empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:13.5px}.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,140%);z-index:50;padding:12px 18px;border-radius:14px;background:var(--solid);border:1px solid var(--line2);box-shadow:0 20px 50px -18px rgba(0,0,0,.6);font-size:13px;font-weight:600;transition:transform .4s cubic-bezier(.2,1.3,.4,1);max-width:calc(100vw - 32px)}
.toast:not(.on){opacity:0;visibility:hidden}
.toast.on{transform:translate(-50%,0);opacity:1;visibility:visible}
a.btn{text-decoration:none;color:inherit}a.btn.wa{color:#05301a}
.hidden{display:none!important}
@media (max-width:560px){ .grid{grid-template-columns:1fr} .hero{gap:14px} .av{width:78px;height:78px} .acts{grid-template-columns:1fr} }
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
/* ===== CONFIG — paste the same Apps Script URL used by the dashboard ===== */
const CONFIG = { SCRIPT_URL: "https://script.google.com/macros/s/AKfycbx0PgSoLZsKaJubymmYW3hhrf3ZB6egTHiVflNjjoxaLLdMvlx_ejUziqGtz5wvvMqTTw/exec" };

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const ST={PENDING:["#fbbf24","Waiting for review"],SCHEDULED:["#34d399","Scheduled"],RESCHEDULED:["#a855f7","Rescheduled"],DECLINED:["#f87171","Not possible"],COMPLETED:["#22d3ee","Completed"],CANCELLED:["#8e98c2","Cancelled"]};
const store={ get(){ try{ return JSON.parse(localStorage.getItem("apt_mine")||"[]"); }catch(e){ return []; } }, set(v){ try{ localStorage.setItem("apt_mine",JSON.stringify(v)); }catch(e){} } };
const url=()=> (CONFIG.SCRIPT_URL||"").trim();
let t0=Date.now();

function jsonp(params, timeout=20000){
  return new Promise((res,rej)=>{
    if(!url()) return rej(new Error("This page isn't connected yet — the CEO office needs to set SCRIPT_URL."));
    const cb="__apt"+Date.now()+Math.floor(Math.random()*1e5), sc=document.createElement("script");
    const done=(f,v)=>{ clearTimeout(t); try{ delete window[cb]; }catch(e){} sc.remove(); f(v); };
    const t=setTimeout(()=>done(rej,new Error("No response. Check your connection and try again.")),timeout);
    window[cb]=d=>done(res,d); sc.onerror=()=>done(rej,new Error("Couldn't reach the server. Try again."));
    sc.src=url()+(url().includes("?")?"&":"?")+new URLSearchParams({...params, callback:cb, _:Date.now()}); document.head.appendChild(sc);
  });
}
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("on"); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove("on"),2600); }
function linkFor(it){ return location.origin+location.pathname+"?ref="+encodeURIComponent(it.ref)+"&k="+encodeURIComponent(it.key); }
function fmtD(dmy){ const m=String(dmy||"").match(/^(\d{2})-(\d{2})-(\d{4})/); if(!m) return dmy||"—"; const d=new Date(+m[3],+m[2]-1,+m[1]); return d.toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short",year:"numeric"}); }

/* theme */
const setTheme=t=>{ if(t) document.documentElement.dataset.theme=t; try{ localStorage.setItem("apt_theme",t||""); }catch(e){} };

/* chips */
$$(".chips").forEach(g=>g.querySelectorAll("button").forEach(b=>b.onclick=()=>{ g.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b)); }));
const chip=k=>{ const b=$(`[data-k="${k}"] button.on`); return b? b.dataset.v : ""; };

/* tabs */
function tab(t){ $$(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===t)); $("#form").classList.toggle("hidden",t!=="new"); $("#done").classList.add("hidden"); $("#mine").classList.toggle("hidden",t!=="mine"); if(t==="mine") loadMine(); if(t==="new") t0=Date.now(); }

const sess={ get(){ try{ return JSON.parse(localStorage.getItem("apt_token")||"null"); }catch(e){ return null; } }, set(v){ try{ v?localStorage.setItem("apt_token",JSON.stringify(v)):localStorage.removeItem("apt_token"); }catch(e){} } };
let mineCount=null;
const countMine=()=>{ $("#mineN").textContent= mineCount!=null ? mineCount : store.get().length; };
const digits=v=>String(v||"").replace(/\D/g,"");
const samePhone=(a,b)=>{ const k=x=>{ let d=digits(x); if(d.length===11&&d[0]==="0") d=d.slice(1); if(d.length===10) d="91"+d; return d; }; return k(a)&&k(a)===k(b); };

/* form */

try{ const me=JSON.parse(localStorage.getItem("apt_me")||"null"); if(me){ $("#manager").value=me.manager||""; $("#phone").value=me.phone||""; $("#dept").value=me.dept||""; } }catch(e){}

function err(m){ const e=$("#err"); e.textContent=m; e.classList.remove("on"); void e.offsetWidth; e.classList.toggle("on",!!m); if(m) e.scrollIntoView({behavior:"smooth",block:"center"}); }
$("#form").onsubmit=async e=>{
  e.preventDefault();

    website:$("#website").value, elapsed:Date.now()-t0 };

  if(d.phone.replace(/\D/g,"").length<7) return err("Please enter a valid WhatsApp / phone number.");
  if(d.purpose.length<3) return err("Please tell us the purpose of the meeting.");
  err(""); const b=$("#go"); b.disabled=true; b.innerHTML='<span class="spn"></span><span>Sending…</span>';
  try{
    const r=await jsonp({action:"apt_submit", data:JSON.stringify(d)});
    if(!r||!r.ok) throw new Error(r&&r.error||"Couldn't send. Please try again.");
    try{ if($("#remember").checked) localStorage.setItem("apt_me",JSON.stringify({manager:d.manager,phone:d.phone,dept:d.dept})); else localStorage.removeItem("apt_me"); }catch(x){}
    const it={ref:r.ref,key:r.key,purpose:d.purpose,at:Date.now()}; store.set([it,...store.get().filter(x=>x.ref!==it.ref)]);
    if(r.token) sess.set({token:r.token, phone:r.phone, name:d.manager});
    if(mineCount!=null) mineCount++; countMine();
    $("#purpose").value=""; $("#details").value="";
    showDone(it, d);
  }catch(x){ err(x.message); }
  finally{ b.disabled=false; b.innerHTML='<span>Send request</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7Z"/></svg>'; }
};
function showDone(it, d){
  $("#form").classList.add("hidden");
  const link=linkFor(it), wa="https://wa.me/?text="+encodeURIComponent(`My meeting request ${it.ref} — “${it.purpose}”. Status: ${link}`);
  $("#done").innerHTML=`<div class="card ok"><div class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6 9 17l-5-5"/></svg></div>
    <h2>Request sent</h2><p>The CEO office will review it and confirm a time.<br>Your reference:</p><div class="ref">${esc(it.ref)}</div>
    <p>All your requests are saved under your number. Check them any time under <b>My requests</b> — on any phone, with your <b>mobile number</b>.</p>
    <div class="acts"><button class="btn" id="cp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>Copy private link</button>
    <a class="btn wa" href="${wa}" target="_blank" rel="noopener">Save to WhatsApp</a>
    <button class="btn full" id="see">📋 View my requests</button><button class="btn full" id="again">✍️ New request</button></div></div>`;
  $("#done").classList.remove("hidden");
  $("#cp").onclick=async()=>{ try{ await navigator.clipboard.writeText(link); toast("Private link copied"); }catch(e){ prompt("Copy your private link:",link); } };
  $("#see").onclick=()=>tab("mine"); $("#again").onclick=()=>tab("new");
  window.scrollTo({top:0,behavior:"smooth"});
}

/* my requests */
function signInBox(msg){
  const me=(()=>{ try{ return JSON.parse(localStorage.getItem("apt_me")||"null")||{}; }catch(e){ return {}; } })();
  return `<form class="card signin" id="sForm" novalidate><h3>📱 See all your requests</h3><p>Enter the WhatsApp / mobile number you used when sending a request.</p>
    <div class="grid"><div class="f full"><label class="l" for="sPhone">WhatsApp / phone</label><input class="in" id="sPhone" type="tel" inputmode="tel" autocomplete="tel" maxlength="16" value="${esc(me.phone||"")}"></div></div>
    <div class="err ${msg?"on":""}" id="sErr" style="margin:12px 0 0">${esc(msg||"")}</div>
    <button class="go" id="sGo" type="submit" style="margin-top:12px"><span>Show my requests</span></button>
    </form>`;
}
function wireSignIn(){
  const f=$("#sForm"); if(!f) return;
  f.onsubmit=async e=>{
    e.preventDefault(); const phone=$("#sPhone").value.trim(), se=$("#sErr");
    const bad=m=>{ se.textContent=m; se.classList.remove("on"); void se.offsetWidth; se.classList.add("on"); };
    if(digits(phone).length<7) return bad("Enter your WhatsApp number.");
    const b=$("#sGo"); b.disabled=true; b.innerHTML='<span class="spn"></span><span>Checking…</span>';
    try{ const r=await jsonp({action:"apt_mine", data:JSON.stringify({phone})}); if(!r||!r.ok) throw new Error(r&&r.error||"Couldn't sign in.");
      sess.set({token:r.token, phone:r.phone, name:r.name}); renderMine(r); toast("Your requests"); }
    catch(x){ bad(x.message); b.disabled=false; b.innerHTML='<span>Show my requests</span>'; }
  };
}
let lastMine=null;
async function loadMine(focus){
  const box=$("#mine"), s=sess.get(); countMine();
  if(!s){
    // not signed in: sign-in box, plus any requests opened from a private link on this phone
    box.innerHTML=signInBox(); wireSignIn();
    if(!loadMine.auto && $("#sPhone").value){ loadMine.auto=1; $("#sForm").requestSubmit(); return; }   // remembered number → open straight away
    const loc=store.get(); if(!loc.length) return;
    try{ const r=await jsonp({action:"apt_status", data:JSON.stringify({items:loc.map(x=>({ref:x.ref,key:x.key}))})});
      if(r&&r.ok&&!sess.get()){ box.insertAdjacentHTML("beforeend",`<p class="fine" style="margin:4px 0 12px">Saved on this phone</p>`+r.items.map((o,i)=>card(o, loc[i])).join("")); wireCards(r.items); focusOn(focus); } }catch(e){}
    return;
  }
  if(!box.querySelector(".req")) box.innerHTML=`<div class="card" style="height:120px;opacity:.5"></div><div class="card" style="height:120px;opacity:.35"></div>`;
  try{
    const r=await jsonp({action:"apt_mine", data:JSON.stringify({token:s.token})});
    if(r&&r.auth){ sess.set(null); mineCount=null; box.innerHTML=signInBox(r.error); wireSignIn(); return; }
    if(!r||!r.ok) throw new Error(r&&r.error||"Couldn't load.");
    // add private-link requests from other numbers that are saved on this phone
    const extra=store.get().filter(x=>!r.items.some(o=>o.ref===x.ref));
    if(extra.length){ try{ const q=await jsonp({action:"apt_status", data:JSON.stringify({items:extra.map(x=>({ref:x.ref,key:x.key}))})}); if(q&&q.ok) r.extra=q.items.filter(o=>!o.missing); }catch(e){} }
    renderMine(r); focusOn(focus);
  }catch(e){ box.innerHTML=`<div class="card empty"><b>Couldn't load your requests</b>${esc(e.message)}<br><br><button class="btn full" onclick="loadMine()">Try again</button></div>`; }
}
function renderMine(r){
  lastMine=r; const box=$("#mine"), all=[...r.items, ...(r.extra||[])]; mineCount=r.items.length; countMine();
  const nm=r.name||"Manager", ini=nm.split(/\s+/).map(w=>w[0]).join("").slice(0,2).toUpperCase();
  const pend=r.items.filter(o=>o.status==="PENDING").length, up=r.items.filter(o=>o.status==="SCHEDULED"||o.status==="RESCHEDULED").length;
  box.innerHTML=`<div class="card"><div class="who"><div class="wav">${esc(ini)}</div><div><b>${esc(nm)}</b><small>+${esc(r.phone)} · ${r.items.length} request${r.items.length===1?"":"s"} · ${pend} waiting · ${up} scheduled</small></div><button class="btn so" id="so">Change number</button></div>
    <p class="fine" style="margin:0;text-align:left">Updated ${new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})} · <a href="#" id="rf" style="color:var(--cyan)">Refresh</a></p></div>`
    + (all.length ? all.map(o=>card(o)).join("") : `<div class="card empty"><b>No requests yet</b>Requests you send with this number appear here with their live status.</div>`);
  $("#rf").onclick=e=>{ e.preventDefault(); loadMine(); };
  $("#so").onclick=()=>{ loadMine.auto=1; sess.set(null); mineCount=null; countMine(); loadMine(); toast("Enter another number"); };
  wireCards(all);
}
function wireCards(items){
  $$("[data-cancel]").forEach(b=>b.onclick=()=>cancel(b.dataset.cancel));
  $$("[data-ics]").forEach(b=>b.onclick=()=>ics(items.find(x=>x.ref===b.dataset.ics)));
  $$("[data-forget]").forEach(b=>b.onclick=()=>{ store.set(store.get().filter(x=>x.ref!==b.dataset.forget)); loadMine(); });
}
function focusOn(focus){ if(!focus) return; const el=document.getElementById("r-"+focus); if(el){ el.scrollIntoView({behavior:"smooth",block:"center"}); el.animate([{boxShadow:"0 0 0 3px #22d3ee"},{boxShadow:"0 0 0 0 transparent"}],{duration:1800}); } }
function card(o, local){
  if(o.missing) return `<div class="card req" style="--sc:#8e98c2"><div class="rq-top"><div><b>${esc(local&&local.purpose||"Request")}</b><div class="rq-ref">${esc(o.ref)}</div></div><span class="pill">NOT FOUND</span></div><p class="fine" style="text-align:left">It may have been removed by the CEO office.</p><button class="btn full" data-forget="${esc(o.ref)}" style="margin-top:10px">Remove from this list</button></div>`;
  const [c,label]=ST[o.status]||["#8e98c2",o.status], sch=o.status==="SCHEDULED"||o.status==="RESCHEDULED"||o.status==="COMPLETED";
  const stage= o.status==="PENDING"?1 : (sch||o.status==="DECLINED")?3 : 2;
  return `<div class="card req" id="r-${esc(o.ref)}" style="--sc:${c}">
    <div class="rq-top"><div><b>${esc(o.purpose)}</b><div class="rq-ref">${esc(o.ref)} · sent ${esc(o.submitted)}</div></div><span class="pill">${esc(label.toUpperCase())}</span></div>
    <div class="steps"><div class="st on"><i>✓</i>Sent</div><div class="bar ${stage>1?"on":""}"></div><div class="st ${stage>1?"on":""}"><i>${stage>1?"✓":"2"}</i>Reviewed</div><div class="bar ${stage>2?"on":""}"></div><div class="st ${stage>2?"on":""}"><i>${o.status==="DECLINED"?"✕":stage>2?"✓":"3"}</i>${o.status==="DECLINED"?"Declined":"Scheduled"}</div></div>
    ${sch?`<div class="sched"><div class="big">📅 ${esc(fmtD(o.schDate))} · ${esc(o.schTime)}</div><small>${esc(o.mode)} · ${esc(o.duration)}${o.venue?" · "+esc(o.venue):""}</small>${o.note?`<small>📝 ${esc(o.note)}</small>`:""}</div>`:""}
    ${o.status==="DECLINED"?`<div class="sched"><div class="big" style="font-size:15px">Not possible this time</div>${o.note?`<small>📝 ${esc(o.note)}</small>`:""}</div>`:""}
    ${o.status==="PENDING"?`<div class="meta"><span>📅 Date &amp; time: assigned by the CEO office</span><span>${esc(o.mode)} · ${esc(o.duration)}</span><span>${esc(o.priority)}</span></div>`:""}
    <div class="acts">${sch&&o.status!=="COMPLETED"?`<button class="btn full" data-ics="${esc(o.ref)}">🗓 Add to my calendar</button>`:""}${o.status==="PENDING"?`<button class="btn red full" data-cancel="${esc(o.ref)}">Cancel request</button>`:""}</div>
  </div>`;
}
async function cancel(ref){
  if(!confirm("Cancel this meeting request?")) return;
  const it=store.get().find(x=>x.ref===ref), s=sess.get();
  try{ const r=await jsonp({action:"apt_cancel", data:JSON.stringify({ref, key:it&&it.key, token:s&&s.token})}); if(!r.ok) throw new Error(r.error); toast("Request cancelled"); loadMine(); }
  catch(e){ toast(e.message); }
}
function ics(o){
  const m=o.schDate.match(/^(\d{2})-(\d{2})-(\d{4})/), t=String(o.schTime).match(/(\d{1,2})[:.](\d{2})\s*(AM|PM)?/i); if(!m) return;
  let h=t?+t[1]:9, mi=t?+t[2]:0; if(t&&t[3]){ if(/PM/i.test(t[3])&&h<12) h+=12; if(/AM/i.test(t[3])&&h===12) h=0; }
  const dur=/1 hour/.test(o.duration)?60:parseInt(o.duration)||30, p=n=>String(n).padStart(2,"0");
  const s=new Date(+m[3],+m[2]-1,+m[1],h,mi), e=new Date(s.getTime()+dur*60000), f=d=>d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+"T"+p(d.getHours())+p(d.getMinutes())+"00";
  const body=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//CEO Office//EN","BEGIN:VEVENT","UID:"+o.ref+"@ceo","DTSTAMP:"+f(new Date()),"DTSTART:"+f(s),"DTEND:"+f(e),"SUMMARY:Meeting — "+o.purpose,"LOCATION:"+(o.venue||o.mode),"DESCRIPTION:"+o.ref+(o.note?" · "+o.note:""),"BEGIN:VALARM","TRIGGER:-PT30M","ACTION:DISPLAY","DESCRIPTION:Meeting","END:VALARM","END:VEVENT","END:VCALENDAR"].join("\r\n");
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([body],{type:"text/calendar"})); a.download=o.ref+".ics"; a.click();
}

/* boot: private link (?ref=&k=) opens straight to that request */
(function(){
  countMine();
  const q=new URLSearchParams(location.search), ref=(q.get("ref")||"").toUpperCase(), k=q.get("k");
  if(ref && k){ const mine=store.get(); if(!mine.some(x=>x.ref===ref)) store.set([{ref,key:k,purpose:"",at:Date.now()},...mine]); history.replaceState(null,"",location.pathname); tab("mine"); loadMine(ref); }
  if(url()) jsonp({action:"public"},8000).then(r=>{ const p=r&&r.profile; if(p&&p.first) $("#ceoName").textContent=(p.first+" "+(p.last||"")).trim(); }).catch(()=>{});
  if(url() && sess.get() && !ref) jsonp({action:"apt_mine", data:JSON.stringify({token:sess.get().token})},12000).then(r=>{ if(r&&r.ok){ mineCount=r.items.length; countMine(); } else if(r&&r.auth){ sess.set(null); } }).catch(()=>{});
  setInterval(()=>{ if(!document.hidden && !$("#mine").classList.contains("hidden")) loadMine(); }, 60000);
})();
</script>
